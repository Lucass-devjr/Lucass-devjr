<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="85%" style="stop-color:#7B61FF"/>
      <stop offset="100%" style="stop-color:#ff4d6d"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6a7"/>
      <stop offset="85%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#ff4d6d"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF"/>
      <stop offset="85%" style="stop-color:#c061ff"/>
      <stop offset="100%" style="stop-color:#ff4d6d"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9a3c"/>
      <stop offset="85%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ff4d6d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" fill="#0a0f1e"/>
  <rect width="800" height="320" rx="12" fill="none" stroke="#1a2a50" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="2" rx="1" fill="url(#barBlue)"/>

  <!-- Header -->
  <rect x="20" y="20" width="760" height="36" rx="4" fill="#0d1428"/>
  <text x="36" y="43" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#4F8EF7" letter-spacing="2">NOVA_CONNECT // DEVELOPMENT STATUS</text>
  <circle cx="748" cy="38" r="6" fill="#00c6a7">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="758" y="43" font-family="'Courier New', monospace" font-size="11" fill="#00c6a7" letter-spacing="1">ONLINE</text>

  <!-- Bar 1: Full Stack -->
  <text x="36" y="100" font-family="'Courier New', monospace" font-size="12" fill="#8899cc" letter-spacing="1">FULL STACK</text>
  <text x="740" y="100" font-family="'Courier New', monospace" font-size="12" fill="#4F8EF7" text-anchor="end">92%</text>
  <!-- Track -->
  <rect x="36" y="108" width="726" height="14" rx="3" fill="#0d1428"/>
  <!-- Bar fill animated -->
  <rect x="36" y="108" width="0" height="14" rx="3" fill="url(#barBlue)">
    <animate attributeName="width" from="0" to="668" dur="1.8s" fill="freeze" begin="0.2s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <!-- Tip dot -->
  <circle cx="36" cy="115" r="7" fill="#ff4d6d" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze" begin="0.2s"/>
    <animate attributeName="cx" from="36" to="704" dur="1.8s" fill="freeze" begin="0.2s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </circle>

  <!-- Bar 2: Automation -->
  <text x="36" y="157" font-family="'Courier New', monospace" font-size="12" fill="#8899cc" letter-spacing="1">AI &amp; AUTOMATION</text>
  <text x="740" y="157" font-family="'Courier New', monospace" font-size="12" fill="#00c6a7" text-anchor="end">87%</text>
  <rect x="36" y="165" width="726" height="14" rx="3" fill="#0d1428"/>
  <rect x="36" y="165" width="0" height="14" rx="3" fill="url(#barGreen)">
    <animate attributeName="width" from="0" to="632" dur="1.8s" fill="freeze" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="36" cy="172" r="7" fill="#ff4d6d" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze" begin="0.5s"/>
    <animate attributeName="cx" from="36" to="668" dur="1.8s" fill="freeze" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </circle>

  <!-- Bar 3: ERP Integration -->
  <text x="36" y="214" font-family="'Courier New', monospace" font-size="12" fill="#8899cc" letter-spacing="1">ERP INTEGRATION</text>
  <text x="740" y="214" font-family="'Courier New', monospace" font-size="12" fill="#7B61FF" text-anchor="end">74%</text>
  <rect x="36" y="222" width="726" height="14" rx="3" fill="#0d1428"/>
  <rect x="36" y="222" width="0" height="14" rx="3" fill="url(#barPurple)">
    <animate attributeName="width" from="0" to="537" dur="1.8s" fill="freeze" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="36" cy="229" r="7" fill="#ff4d6d" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze" begin="0.8s"/>
    <animate attributeName="cx" from="36" to="573" dur="1.8s" fill="freeze" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </circle>

  <!-- Bar 4: Faster Ventures -->
  <text x="36" y="271" font-family="'Courier New', monospace" font-size="12" fill="#8899cc" letter-spacing="1">FASTER VENTURES</text>
  <text x="740" y="271" font-family="'Courier New', monospace" font-size="12" fill="#ff9a3c" text-anchor="end">68%</text>
  <rect x="36" y="279" width="726" height="14" rx="3" fill="#0d1428"/>
  <rect x="36" y="279" width="0" height="14" rx="3" fill="url(#barOrange)">
    <animate attributeName="width" from="0" to="494" dur="1.8s" fill="freeze" begin="1.1s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>
  <circle cx="36" cy="286" r="7" fill="#ff4d6d" opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze" begin="1.1s"/>
    <animate attributeName="cx" from="36" to="530" dur="1.8s" fill="freeze" begin="1.1s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </circle>

  <!-- Bottom scrolling text -->
  <text y="308" font-family="'Courier New', monospace" font-size="11" fill="#1e3a6e" letter-spacing="2">
    <textPath href="#scroll">
      &gt; syncing development modules...  BUILD - CREATE - AUTOMATE - EVOLVE  |  Nova Connect v2.0  |  Faster Soluções em Tecnologia  |
    </textPath>
  </text>
  <defs>
    <path id="scroll" d="M 0 308 H 800"/>
  </defs>
</svg>
